global:
  scrape_interval: 15s      # Ogni quanto raccogliere metriche
  evaluation_interval: 15s  # Ogni quanto valutare le regole
  external_labels:
    monitor: 'sentiment-analysis-monitor'

# Configurazione degli scraper
scrape_configs:
  # Prometheus stesso (self-monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          group: 'monitoring'

  # Sentiment Analysis API su Kubernetes
  - job_name: 'sentiment-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: 
          - 'host.docker.internal:30080'
        labels:
          service: 'sentiment-analysis'
          environment: 'production'
          version: 'latest'