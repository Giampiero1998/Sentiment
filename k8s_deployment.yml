# =========================================================
# 1. Deployment (Gestisce i Pod e lo stato dell'applicazione)
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentiment-analysis-deployment
  labels:
    app: sentiment-api
spec:
  # Numero di repliche dell'applicazione
  replicas: 2
  selector:
    matchLabels:
      app: sentiment-api
  # La specifica del template del pod
  template:
    metadata:
      labels:
        app: sentiment-api
    spec:
      # Riferimento all'ImagePullSecret per il registro Docker privato (regcred)
      imagePullSecrets:
      - name: regcred
        
      containers:
      - name: sentiment-api-container
        # Placeholder che verrà sostituito dal Jenkinsfile con il tag GIT
        image: IMAGE_PLACEHOLDER 
        ports:
        - containerPort: 8000

        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        # Carica l'API_KEY dal Secret di Kubernetes (sentiment-api-key)
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: sentiment-api-key # Nome del Secret creato
              key: API_KEY # Chiave all'interno del Secret

        # Configura le sonde di liveness e readiness
        livenessProbe:   
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10 
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3

# =========================================================
# 2. Service (Espone l'applicazione all'esterno del cluster)
# =========================================================
---
apiVersion: v1
kind: Service  
metadata:
  name: sentiment-analysis-service
  labels:
    app: sentiment-api
spec:
  selector:
    # Assicura che il Service indirizzi il traffico ai Pod creati dal Deployment
    app: sentiment-api 
  type: NodePort 
  ports:
    - port: 80
      targetPort: 8000 # La porta interna del container
      nodePort: 30080 # Porta esterna, accessibile su http://localhost:30080
      protocol: TCP